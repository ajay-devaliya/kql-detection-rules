id: 6195d7c8-bcc0-43d5-b978-a406d5f23356
name: Firewall - Inbound connection allowed from a restricted country
description: |
  Detects inbound connections from public IPs located in a restricted country that the firewall allowed (FortiGate accept/close/timeout, Palo Alto allow). If your policy is to block these countries, any allowed session means a geo-blocking gap or a misconfigured rule. Country comes from the FortiGate srccountry field when present, otherwise from Sentinel's geo_info_from_ip_address().
severity: High
status: Available
requiredDataConnectors:
- connectorId: CefAma
  dataTypes:
  - CommonSecurityLog
- connectorId: Fortinet
  dataTypes:
  - CommonSecurityLog
- connectorId: PaloAltoNetworks
  dataTypes:
  - CommonSecurityLog
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- InitialAccess
- CommandAndControl
relevantTechniques:
- T1190
- T1133
query: |
  let lookback = 1h;
  // EXAMPLE list only. Replace with your organisation's or customer's restricted-country policy.
  // Add every spelling your data uses (run the country check in docs/data-sources.md).
  let RestrictedCountries = dynamic([
      "North Korea", "Korea, Democratic People's Republic of",
      "Iran", "Iran, Islamic Republic of",
      "Syria", "Syrian Arab Republic",
      "Cuba"
  ]);
  // FortiGate logs allowed sessions as accept/close/timeout/*-rst; Palo Alto uses allow
  let AllowedActions = dynamic(["accept", "allow", "close", "timeout", "server-rst", "client-rst"]);
  CommonSecurityLog
  | where TimeGenerated > ago(lookback)
  | where DeviceVendor in ("Fortinet", "Palo Alto Networks")
  | where isnotempty(SourceIP) and not(ipv4_is_private(SourceIP))
  | where tolower(DeviceAction) in (AllowedActions)
  | extend SourceCountry = coalesce(
      extract(@"FTNTFGTsrccountry=([^;]+)", 1, AdditionalExtensions),
      tostring(geo_info_from_ip_address(SourceIP).country))
  | where SourceCountry in~ (RestrictedCountries)
  | summarize
      StartTime = min(TimeGenerated),
      EndTime = max(TimeGenerated),
      SessionCount = count(),
      DestinationIPs = make_set(DestinationIP, 25),
      DestinationPorts = make_set(DestinationPort, 25),
      Actions = make_set(DeviceAction, 10),
      BytesSent = sum(SentBytes),
      BytesReceived = sum(ReceivedBytes),
      FirewallName = take_any(DeviceName)
      by SourceIP, SourceCountry, DeviceVendor
  | project StartTime, EndTime, SourceIP, SourceCountry, SessionCount, DestinationIPs, DestinationPorts, Actions, BytesSent, BytesReceived, DeviceVendor, FirewallName
entityMappings:
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: SourceIP
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: FirewallName
customDetails:
  SourceCountry: SourceCountry
  SessionCount: SessionCount
  DestinationPorts: DestinationPorts
  DestinationIPs: DestinationIPs
alertDetailsOverride:
  alertDisplayNameFormat: Inbound traffic allowed from {{SourceCountry}} ({{SourceIP}})
  alertDescriptionFormat: The firewall allowed {{SessionCount}} inbound session(s) from {{SourceIP}} in restricted country {{SourceCountry}}.
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
metadata:
  source:
    kind: Community
  author:
    name: Ajay Devaliya
  support:
    tier: Community
  categories:
    domains:
    - Security - Network
