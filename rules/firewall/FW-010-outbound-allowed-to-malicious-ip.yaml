id: b2df3c81-ccba-487a-8ef8-79cc0c733aa4
name: Firewall - Outbound connection allowed to a threat-intelligence IP
description: |
  Detects internal hosts making outbound connections to IPs that are active indicators in Microsoft Sentinel threat intelligence, where the firewall allowed the session. This can indicate malware calling its command-and-control server or data being sent to attacker infrastructure.
severity: High
status: Available
requiredDataConnectors:
- connectorId: CefAma
  dataTypes:
  - CommonSecurityLog
- connectorId: Fortinet
  dataTypes:
  - CommonSecurityLog
- connectorId: PaloAltoNetworks
  dataTypes:
  - CommonSecurityLog
- connectorId: ThreatIntelligence
  dataTypes:
  - ThreatIntelIndicators
- connectorId: ThreatIntelligenceTaxii
  dataTypes:
  - ThreatIntelIndicators
- connectorId: MicrosoftDefenderThreatIntelligence
  dataTypes:
  - ThreatIntelIndicators
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
- CommandAndControl
- Exfiltration
relevantTechniques:
- T1071
- T1041
query: |
  let dt_lookBack = 1h;
  let ioc_lookBack = 14d;
  let MinConfidence = 0;   // raise (for example to 50) if low-confidence indicators are noisy
  // FortiGate logs allowed sessions as accept/close/timeout/*-rst; Palo Alto uses allow
  let AllowedActions = dynamic(["accept", "allow", "close", "timeout", "server-rst", "client-rst"]);
  let MaliciousIPs = ThreatIntelIndicators
      | where TimeGenerated > ago(ioc_lookBack)
      | where ObservableKey in ("ipv4-addr:value", "ipv6-addr:value", "network-traffic:src_ref.value", "network-traffic:dst_ref.value")
      | summarize arg_max(TimeGenerated, *) by Id
      | where IsDeleted == false and (isnull(ValidUntil) or ValidUntil > now())
      | extend TI_Description = tostring(Data.description)
      | summarize arg_max(Confidence, TI_Description, Id) by TI_IP = ObservableValue
      | project TI_IP, TI_Confidence = Confidence, TI_Description, TI_IndicatorId = Id;
  CommonSecurityLog
  | where TimeGenerated > ago(dt_lookBack)
  | where DeviceVendor in ("Fortinet", "Palo Alto Networks")
  | where isnotempty(SourceIP) and isnotempty(DestinationIP)
  | where ipv4_is_private(SourceIP) and not(ipv4_is_private(DestinationIP))
  | where tolower(DeviceAction) in (AllowedActions)
  | join kind=inner (MaliciousIPs | where TI_Confidence >= MinConfidence) on $left.DestinationIP == $right.TI_IP
  | summarize
      StartTime = min(TimeGenerated),
      EndTime = max(TimeGenerated),
      SessionCount = count(),
      DestinationPorts = make_set(DestinationPort, 25),
      Applications = make_set(ApplicationProtocol, 10),
      BytesSent = sum(SentBytes),
      BytesReceived = sum(ReceivedBytes),
      FirewallName = take_any(DeviceName)
      by SourceIP, DestinationIP, TI_Confidence, TI_Description, TI_IndicatorId, DeviceVendor
  | project StartTime, EndTime, SourceIP, DestinationIP, SessionCount, DestinationPorts, Applications, BytesSent, BytesReceived, TI_Confidence, TI_Description, TI_IndicatorId, DeviceVendor, FirewallName
entityMappings:
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: SourceIP
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: DestinationIP
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: FirewallName
customDetails:
  SessionCount: SessionCount
  BytesSent: BytesSent
  DestinationPorts: DestinationPorts
  TIConfidence: TI_Confidence
  TIDescription: TI_Description
alertDetailsOverride:
  alertDisplayNameFormat: Internal host {{SourceIP}} connected to malicious IP {{DestinationIP}}
  alertDescriptionFormat: The firewall allowed {{SessionCount}} outbound session(s) from {{SourceIP}} to threat-intel IP {{DestinationIP}}.
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
metadata:
  source:
    kind: Community
  author:
    name: Ajay Devaliya
  support:
    tier: Community
  categories:
    domains:
    - Security - Network
