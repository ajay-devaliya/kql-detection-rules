id: 199eabc7-da17-48d4-9e0f-bff837db8d5a
name: Windows - Reverse shell command line
description: |
  Detects common reverse shell patterns on Windows: PowerShell creating a System.Net.Sockets.TCPClient and streaming a shell, powercat, Invoke-PowerShellTcp (Nishang), netcat or ncat run with -e / --exec, socat with exec, and bash /dev/tcp one-liners through WSL.
severity: High
status: Available
requiredDataConnectors:
- connectorId: SecurityEvents
  dataTypes:
  - SecurityEvent
- connectorId: WindowsSecurityEvents
  dataTypes:
  - SecurityEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- Execution
- CommandAndControl
relevantTechniques:
- T1059
- T1095
- T1059.001
- T1059.003
query: |
  let lookback = 1h;
  let ProcessEvents = union
      (SecurityEvent
          | where TimeGenerated > ago(lookback)
          | where EventID == 4688
          | project TimeGenerated, Computer, AccountName = SubjectUserName, AccountDomain = SubjectDomainName,
              ProcessName = NewProcessName, OriginalFileName = "", CommandLine, ParentProcessName, EventSource = "Security 4688"),
      (Event
          | where TimeGenerated > ago(lookback)
          | where Source == "Microsoft-Windows-Sysmon" and EventID == 1
          | extend X = parse_xml(EventData)
          | mv-apply D = X.DataItem.EventData.Data on (summarize Props = make_bag(bag_pack(tostring(D["@Name"]), tostring(D["#text"]))))
          | extend U = split(tostring(Props.User), "\\")
          | project TimeGenerated, Computer,
              AccountName = tostring(U[-1]), AccountDomain = iff(array_length(U) > 1, tostring(U[0]), ""),
              ProcessName = tostring(Props.Image), OriginalFileName = tostring(Props.OriginalFileName),
              CommandLine = tostring(Props.CommandLine), ParentProcessName = tostring(Props.ParentImage), EventSource = "Sysmon 1")
      | extend ProcessFile = tolower(tostring(split(ProcessName, "\\")[-1])),
               ParentFile = tolower(tostring(split(ParentProcessName, "\\")[-1]));
  ProcessEvents
  | where CommandLine matches regex @"(?i)(net\.sockets\.tcpclient|tcpclient\(.*\)\.getstream|powercat|invoke-powershelltcp|invoke-conptyshell|\b(nc|ncat|netcat)(\.exe)?\s.*(-e|--exec|--sh-exec)\s|socat(\.exe)?\s.*exec:|/dev/tcp/|bash\s+-i\s+>&)"
      or ProcessFile in ("nc.exe", "nc64.exe", "ncat.exe", "socat.exe", "powercat.exe")
  | summarize
      StartTime = min(TimeGenerated),
      EndTime = max(TimeGenerated),
      Executions = count(),
      CommandLines = make_set(CommandLine, 10),
      Processes = make_set(ProcessName, 10),
      ParentProcesses = make_set(ParentProcessName, 10),
      EventSources = make_set(EventSource, 2)
      by Computer, AccountName, AccountDomain
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: FullName
    columnName: Computer
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: AccountName
  - identifier: NTDomain
    columnName: AccountDomain
customDetails:
  CommandLines: CommandLines
  Processes: Processes
  ParentProcesses: ParentProcesses
alertDetailsOverride:
  alertDisplayNameFormat: Reverse shell activity on {{Computer}} by {{AccountName}}
  alertDescriptionFormat: A reverse shell command or tool was run on {{Computer}} by {{AccountName}}.
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
metadata:
  source:
    kind: Community
  author:
    name: Ajay Devaliya
  support:
    tier: Community
  categories:
    domains:
    - Security - Threat Protection
