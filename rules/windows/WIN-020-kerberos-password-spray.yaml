id: 5d7a3f1e-0b1c-4e0e-9a51-2f0f6a7c1020
name: Windows - Kerberos password spray or user enumeration
description: |
  Detects one source IP causing Kerberos pre-authentication failures with a bad password (4771, status 0x18) for 10 or more accounts, or requests for 10 or more non-existent users (4768, status 0x6), within an hour. Kerberos-based spraying avoids the 4625 events most brute-force rules watch.
severity: High
status: Available
requiredDataConnectors:
- connectorId: SecurityEvents
  dataTypes:
  - SecurityEvent
- connectorId: WindowsSecurityEvents
  dataTypes:
  - SecurityEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
- Discovery
relevantTechniques:
- T1110
- T1087
- T1110.003
- T1087.002
query: |
  let lookback = 1h;
  let AccountThreshold = 10;
  SecurityEvent
  | where TimeGenerated > ago(lookback)
  | where (EventID == 4771 and Status =~ "0x18") or (EventID == 4768 and Status =~ "0x6")
  | extend SourceIP = trim_start(@"::ffff:", IpAddress)
  | extend Pattern = iff(EventID == 4771, "Bad password (spray)", "Unknown user (enumeration)")
  | summarize
      StartTime = min(TimeGenerated),
      EndTime = max(TimeGenerated),
      Failures = count(),
      DistinctAccounts = dcount(TargetUserName),
      Accounts = make_set(TargetUserName, 25),
      DomainControllers = make_set(Computer, 5)
      by SourceIP, Pattern
  | where DistinctAccounts >= AccountThreshold
entityMappings:
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: SourceIP
customDetails:
  Pattern: Pattern
  DistinctAccounts: DistinctAccounts
  Accounts: Accounts
alertDetailsOverride:
  alertDisplayNameFormat: Kerberos {{Pattern}} from {{SourceIP}}
  alertDescriptionFormat: '{{SourceIP}} caused Kerberos failures for {{DistinctAccounts}} different accounts within one hour.'
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
metadata:
  source:
    kind: Community
  author:
    name: Ajay Devaliya
  support:
    tier: Community
  categories:
    domains:
    - Security - Threat Protection
