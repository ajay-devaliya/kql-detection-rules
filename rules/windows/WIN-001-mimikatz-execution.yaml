id: 5d7a3f1e-0b1c-4e0e-9a51-2f0f6a7c1001
name: Windows - Mimikatz execution or command-line usage
description: |
  Detects Mimikatz by its binary name, its original file name (catches renamed copies when Sysmon is present), its module commands such as sekurlsa:: and lsadump::, or Invoke-Mimikatz in PowerShell. Mimikatz is used to dump credentials from memory, forge Kerberos tickets and pass the hash.
severity: High
status: Available
requiredDataConnectors:
- connectorId: SecurityEvents
  dataTypes:
  - SecurityEvent
- connectorId: WindowsSecurityEvents
  dataTypes:
  - SecurityEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
relevantTechniques:
- T1003
- T1003.001
query: |
  let lookback = 1h;
  let ProcessEvents = union
      (SecurityEvent
          | where TimeGenerated > ago(lookback)
          | where EventID == 4688
          | project TimeGenerated, Computer, AccountName = SubjectUserName, AccountDomain = SubjectDomainName,
              ProcessName = NewProcessName, OriginalFileName = "", CommandLine, ParentProcessName, EventSource = "Security 4688"),
      (Event
          | where TimeGenerated > ago(lookback)
          | where Source == "Microsoft-Windows-Sysmon" and EventID == 1
          | extend X = parse_xml(EventData)
          | mv-apply D = X.DataItem.EventData.Data on (summarize Props = make_bag(bag_pack(tostring(D["@Name"]), tostring(D["#text"]))))
          | extend U = split(tostring(Props.User), "\\")
          | project TimeGenerated, Computer,
              AccountName = tostring(U[-1]), AccountDomain = iff(array_length(U) > 1, tostring(U[0]), ""),
              ProcessName = tostring(Props.Image), OriginalFileName = tostring(Props.OriginalFileName),
              CommandLine = tostring(Props.CommandLine), ParentProcessName = tostring(Props.ParentImage), EventSource = "Sysmon 1")
      | extend ProcessFile = tolower(tostring(split(ProcessName, "\\")[-1])),
               ParentFile = tolower(tostring(split(ParentProcessName, "\\")[-1]));
  ProcessEvents
  | where ProcessFile in ("mimikatz.exe", "mimilove.exe")
      or OriginalFileName =~ "mimikatz.exe"
      or CommandLine matches regex @"(?i)(sekurlsa::|lsadump::|kerberos::(golden|ptt|list|tgt)|privilege::debug|token::elevate|misc::memssp|dpapi::|vault::cred|crypto::capi|invoke-mimikatz)"
  | summarize
      StartTime = min(TimeGenerated),
      EndTime = max(TimeGenerated),
      Executions = count(),
      CommandLines = make_set(CommandLine, 10),
      Processes = make_set(ProcessName, 10),
      ParentProcesses = make_set(ParentProcessName, 10),
      EventSources = make_set(EventSource, 2)
      by Computer, AccountName, AccountDomain
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: FullName
    columnName: Computer
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: AccountName
  - identifier: NTDomain
    columnName: AccountDomain
customDetails:
  CommandLines: CommandLines
  Processes: Processes
  ParentProcesses: ParentProcesses
alertDetailsOverride:
  alertDisplayNameFormat: Mimikatz activity on {{Computer}} by {{AccountName}}
  alertDescriptionFormat: Mimikatz binary or commands were run on {{Computer}} by {{AccountName}}.
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
metadata:
  source:
    kind: Community
  author:
    name: Ajay Devaliya
  support:
    tier: Community
  categories:
    domains:
    - Security - Threat Protection
